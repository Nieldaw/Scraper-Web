services:
  db:
    image: postgres:16-alpine
    container_name: immo_ne_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-immo_ne}
      POSTGRES_USER: ${POSTGRES_USER:-immo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-immo}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-immo} -d ${POSTGRES_DB:-immo_ne}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
