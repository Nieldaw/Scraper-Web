{# Icônes SVG inline (24x24, trait). Usage : {{ icon("home") }} #}
{% macro icon(name) -%}
<svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

{%- elif name == "clock" %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>

{%- elif name == "chat" %}<path d="M4 5h16v11H9l-5 4z"/>
{%- elif name == "user" %}<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>
{%- elif name == "search" %}<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
{%- elif name == "menu" %}<path d="M4 7h16M4 12h10M4 17h16"/>
{%- elif name == "plus" %}<path d="M12 5v14M5 12h14"/>
{%- elif name == "bed" %}<path d="M3 18V7M3 14h18v4M21 14v-2a3 3 0 0 0-3-3h-7v5"/>
{%- elif name == "expand" %}<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>

{%- elif name == "cog" %}<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>

{%- endif %}</svg>
